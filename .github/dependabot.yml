version: 2
updates:
  # Rust dependencies (Cargo.toml / Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The `rdp` bindings in src/rdp/windows/bindings.rs are generated for one
      # windows-core release line. Keep windows-core bumps in their own PR (not
      # the cargo-minor batch): a new 0.x line also needs the matching
      # windows-bindgen in tools/rdp-bindings and regenerated bindings
      # (scripts/generate-rdp-bindings.sh). Listed first because Dependabot
      # assigns a dependency to the first group it matches.
      windows:
        patterns:
          - "windows-core"
      # Batch routine patch/minor bumps into a single PR to cut review noise.
      cargo-minor:
        update-types:
          - minor
          - patch
    ignore:
      # password-hash must track the version argon2 uses (0.5.x today). A
      # standalone bump to 0.6 pulls in a second, incompatible password-hash
      # and breaks the build; let argon2 drive the major. Patch updates within
      # the current series are still allowed.
      - dependency-name: "password-hash"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # The generator for the `rdp` bindings (not part of the published crate).
  # Bump windows-bindgen together with the main crate's windows-core and
  # regenerate src/rdp/windows/bindings.rs; the `rdp bindings up to date` CI
  # job fails until the committed bindings match the new generator.
  - package-ecosystem: cargo
    directory: "/tools/rdp-bindings"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # GitHub Actions used by the CI and release workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The `msrv` CI job pins dtolnay/rust-toolchain to the project's MSRV
      # (1.88.0) on purpose — it must not track the latest toolchain, and the
      # action repo exposes phantom version branches (e.g. 1.100.0) with no
      # matching Rust release. Other uses of this action are @stable. Every use
      # is pinned to a commit SHA (with a `# stable`/`# 1.88.0` comment); this
      # entry opts the action out of Dependabot, so bump those SHAs manually.
      - dependency-name: "dtolnay/rust-toolchain"

  # Base images in the Dockerfile. They are pinned by digest (`image:tag@sha256`)
  # so the mutable tag cannot drift; Dependabot bumps the digest (and tag) here.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
