name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "10.14"
  # Hosted runners include Node. Make the wizard's executable browser-state
  # test fail rather than silently skip if that runtime ever disappears.
  ALIGHIERI_REQUIRE_NODE_TESTS: "1"

jobs:
  # Build, lint, and run the full test suite (unit/component + integration)
  # on every first-class platform. Windows is included so the Windows Service
  # and Event Log code is compiled, linted, and tested too. macOS covers the
  # Unix console path that Linux CI does not execute (Apple Silicon hosted).
  test:
    name: test & clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - name: Verify Node.js for wizard browser-state tests
        run: node --version
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Clippy (all targets, warnings denied)
        run: cargo clippy --all-targets --locked -- -D warnings
      # The plugin SDK, Linux installer companion, and Windows RDP transport are
      # off by default. Exercise every feature on both platforms so target-gated
      # modules and their fail-closed non-native stubs stay buildable.
      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --locked --all-features -- -D warnings
      - name: Test (lib, bins, integration, examples)
        run: cargo test --all-targets --locked
        env:
          # On Windows, require the ProgramData DACL tests to actually run: they
          # skip on a non-elevated account, so without this a runner that cannot
          # apply the DACL could report green while never verifying it. Empty on
          # Linux (the tests are Windows-only), where it has no effect.
          ALIGHIERI_REQUIRE_DACL_TESTS: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      - name: Test (all features)
        run: cargo test --all-targets --locked --all-features
        env:
          ALIGHIERI_REQUIRE_DACL_TESTS: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      - name: Build all-feature Windows binaries
        if: runner.os == 'Windows'
        run: cargo build --locked --all-features --bins
      - name: Assert Windows RDP helper binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $required = @(
            "target/debug/alighieri-rdp-transport.exe",
            "target/debug/alighieri-rdp-agent.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required RDP helper binary is missing: $path"
            }
          }
      - name: Build installer filesystem companion for contract tests
        if: runner.os == 'Linux'
        run: cargo build --locked --features installer-fs --bin alighieri-installer-fs
      - name: Test installer and companion contract
        if: runner.os == 'Linux'
        run: bash scripts/alighieri.sh __selftest
        env:
          # Test-only override: production resolves the version-matched helper
          # from the source checkout or extracted Linux release archive.
          ALIGHIERI_INSTALLER_FS_HELPER_TEST_BIN: target/debug/alighieri-installer-fs
      - name: Cargo run selects the service binary
        run: cargo run --locked -- --version
      - name: macOS launchd example smoke
        if: runner.os == 'macOS'
        run: |
          test -x scripts/macos-install-smoke.sh
          test -x scripts/package-unix.sh
          test -x scripts/macos-daemon.sh
          scripts/macos-install-smoke.sh
      - name: Package Unix archive layout
        if: runner.os != 'Windows'
        run: |
          test -x scripts/package-unix.sh
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            ASSET="$(
              scripts/package-unix.sh \
                --os linux \
                --target x86_64-unknown-linux-gnu \
                --version test \
                --bindir target/debug \
                --archive
            )" || exit 1
            test -f "$ASSET"
            tar tzf "$ASSET" | grep -Fqx "alighieri-vtest-x86_64-unknown-linux-gnu/LICENSING.md"
            tar tzf "$ASSET" | grep -Fqx "alighieri-vtest-x86_64-unknown-linux-gnu/scripts/alighieri.sh"
            if tar tzf "$ASSET" | grep -Fq "macos-daemon.sh"; then
              echo "Linux archive must not contain macos-daemon.sh" >&2
              exit 1
            fi
            if tar tzf "$ASSET" | grep -Fq "macos-launch"; then
              echo "Linux archive must not contain macOS launchd plists" >&2
              exit 1
            fi
          else
            ASSET="$(
              scripts/package-unix.sh \
                --os macos \
                --target aarch64-apple-darwin \
                --version test \
                --bindir target/debug \
                --archive
            )" || exit 1
            test -f "$ASSET"
            tar tzf "$ASSET" | grep -Fqx "alighieri-vtest-aarch64-apple-darwin/LICENSING.md"
            tar tzf "$ASSET" | grep -Fqx "alighieri-vtest-aarch64-apple-darwin/scripts/macos-daemon.sh"
            if tar tzf "$ASSET" | grep -Fq "scripts/alighieri.sh"; then
              echo "macOS archive must not contain the Linux installer" >&2
              exit 1
            fi
            extract="$RUNNER_TEMP/alighieri-macos-archive"
            mkdir -p "$extract"
            tar -xzf "$ASSET" -C "$extract"
            "$extract/alighieri-vtest-aarch64-apple-darwin/alighieri" --version
            test -x "$extract/alighieri-vtest-aarch64-apple-darwin/scripts/macos-daemon.sh"
            "$extract/alighieri-vtest-aarch64-apple-darwin/scripts/macos-daemon.sh" __selftest
          fi
      - name: Doctests
        run: cargo test --doc --locked

  # Cross-compile extra release targets so the release matrix is validated on
  # every change, not only when a tag is pushed. Build-only: hosted runners
  # cannot execute foreign-architecture binaries.
  cross-build:
    name: cross-build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker: gcc-aarch64-linux-gnu
            features: --features installer-fs
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            features: --features rdp
          # Hosted macos-latest is Apple Silicon; this job only proves the
          # Intel Darwin target still links. Runtime tests stay on aarch64
          # via the macos-latest test matrix entry.
          - os: macos-latest
            target: x86_64-apple-darwin
            features: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install aarch64 cross toolchain (Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          # Linker for cargo, and CC so cc-rs build scripts (e.g. ring) use the
          # cross compiler instead of the host toolchain.
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"
      - name: Cross-compile (release, build-only)
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Assert cross-compiled macOS console binary
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          test -x "target/${{ matrix.target }}/release/alighieri"
          test -x scripts/package-unix.sh
          ASSET="$(
            scripts/package-unix.sh \
              --os macos \
              --target x86_64-apple-darwin \
              --version test \
              --bindir "target/${{ matrix.target }}/release" \
              --archive
          )" || exit 1
          test -f "$ASSET"
          file "target/${{ matrix.target }}/release/alighieri"
          lipo -archs "target/${{ matrix.target }}/release/alighieri" | grep -Fq x86_64
          minos="$(vtool -show-build "target/${{ matrix.target }}/release/alighieri" | awk '/minos/ { print $2; exit }')"
          [[ -n "$minos" ]] || { echo "vtool did not report a minos" >&2; exit 1; }
          awk -v minos="$minos" 'BEGIN {
            n = split(minos, p, ".")
            major = p[1] + 0
            minor = (n >= 2 ? p[2] : 0) + 0
            if (major > 10 || (major == 10 && minor > 14)) {
              exit 1
            }
          }' || { echo "x86_64 Darwin minos $minos is newer than the documented 10.14 floor" >&2; exit 1; }
      - name: Assert cross-compiled Windows RDP helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = "target/${{ matrix.target }}/release"
          foreach ($name in @("alighieri-rdp-transport.exe", "alighieri-rdp-agent.exe")) {
            $path = Join-Path $releaseDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required cross-compiled RDP helper is missing: $path"
            }
          }

  # Formatting is platform-independent, so check it once.
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # In-repo Homebrew formula: style/audit, head-only refusal, then an install
  # from this checkout. Does not duplicate the macOS cargo test matrix.
  # Do not `brew install --HEAD` here: that clones GitHub main, which does
  # not yet contain this branch. The head URL is asserted instead.
  homebrew:
    name: homebrew formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Style and audit
        run: |
          brew style Formula/alighieri.rb
          brew tap-new --no-git local/alighieri
          cp Formula/alighieri.rb "$(brew --repository local/alighieri)/Formula/"
          # Audit the formula as a user would load it: no local override.
          env -u HOMEBREW_ALIGHIERI_SOURCE brew audit --strict local/alighieri/alighieri
      - name: Refuse a stable archive without a local checkout
        env:
          HOMEBREW_NO_INSTALL_FROM_API: 1
          HOMEBREW_NO_ASK: 1
        run: |
          set -euo pipefail
          json="${RUNNER_TEMP}/alighieri-head-only.json"
          log="${RUNNER_TEMP}/alighieri-plain-install.log"
          env -u HOMEBREW_ALIGHIERI_SOURCE \
            brew info --json=v2 --formula local/alighieri/alighieri >"$json"
          python3 - "$json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              info = json.load(handle)
          formulae = info.get("formulae") or []
          if len(formulae) != 1:
              sys.exit(f"expected one formula from brew info, got {len(formulae)}")
          formula = formulae[0]
          stable = (formula.get("urls") or {}).get("stable") or {}
          stable_url = stable.get("url") or ""
          stable_version = ((formula.get("versions") or {}).get("stable")) or ""
          # Head-only formulae have no stable url. Some Homebrew versions
          # report the stable version as "HEAD"; a real archive version must
          # not appear.
          if stable_url or (stable_version and stable_version != "HEAD"):
              sys.exit(
                  "plain formula selected a stable source "
                  f"url={stable_url!r} version={stable_version!r}"
              )
          head = (formula.get("urls") or {}).get("head") or {}
          if head.get("url") != "https://github.com/wiresock/alighieri.git":
              sys.exit(f"unexpected head url: {head!r}")
          if head.get("branch") != "main":
              sys.exit(f"unexpected head branch: {head!r}")
          print("head-only formula source: GitHub main, no stable archive")
          PY
          set +e
          env -u HOMEBREW_ALIGHIERI_SOURCE \
            brew install --formula local/alighieri/alighieri >"$log" 2>&1
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "plain install succeeded without --HEAD or a local checkout" >&2
            cat "$log" >&2
            exit 1
          fi
          if ! grep -Fi "head-only formula" "$log" >/dev/null; then
            echo "plain install failed, but not with the head-only refusal" >&2
            cat "$log" >&2
            exit 1
          fi
          if ! grep -F "brew install --HEAD" "$log" >/dev/null; then
            echo "head-only refusal did not tell the user to pass --HEAD" >&2
            cat "$log" >&2
            exit 1
          fi
          if grep -F "v0.6.0.tar.gz" "$log" >/dev/null; then
            echo "plain install referenced the v0.6.0 archive" >&2
            cat "$log" >&2
            exit 1
          fi
          echo "plain install refused before building a stable archive"
      - name: Install via formula from this checkout
        env:
          HOMEBREW_ALIGHIERI_SOURCE: ${{ github.workspace }}
          HOMEBREW_NO_INSTALL_FROM_API: 1
          HOMEBREW_NO_ASK: 1
        run: |
          set -euo pipefail
          json="${RUNNER_TEMP}/alighieri-local-source.json"
          log="${RUNNER_TEMP}/alighieri-local-install.log"
          expected_rev="$(git rev-parse HEAD)"
          brew info --json=v2 --formula local/alighieri/alighieri >"$json"
          python3 - "$json" "$expected_rev" "${HOMEBREW_ALIGHIERI_SOURCE}" <<'PY'
          import json
          import os
          import sys

          json_path, expected_rev, source = sys.argv[1:]
          with open(json_path, encoding="utf-8") as handle:
              info = json.load(handle)
          formula = info["formulae"][0]
          stable = (formula.get("urls") or {}).get("stable") or {}
          url = stable.get("url") or ""
          revision = stable.get("revision") or ""
          using = stable.get("using") or ""
          if "v0.6.0.tar.gz" in url or "/tags/v0.6.0" in url:
              sys.exit(f"local install still selects the v0.6.0 archive: {url}")
          if not url.startswith("file://"):
              sys.exit(f"local install did not select a file checkout: {url}")
          path = url[len("file://"):]
          if os.path.realpath(path) != os.path.realpath(source):
              sys.exit(f"stable url {url} is not {source}")
          if revision != expected_rev:
              sys.exit(f"formula revision {revision} != checkout {expected_rev}")
          if using and using != "git":
              sys.exit(f"expected git strategy, got {using}")
          head = (formula.get("urls") or {}).get("head") or {}
          if head.get("url") != "https://github.com/wiresock/alighieri.git" or head.get("branch") != "main":
              sys.exit(f"head spec changed: {head!r}")
          print(f"formula selected {revision} from {url}")
          PY
          dump_homebrew_failure() {
            echo "===== brew install output ====="
            cat "$log" >&2 || true
            echo "===== brew config ====="
            brew config >&2 || true
            echo "===== brew trust ====="
            brew trust --json=v1 >&2 || true
            echo "===== Homebrew log files ====="
            local roots=()
            roots+=("${HOME}/Library/Logs/Homebrew")
            roots+=("$(brew --prefix)/var/log")
            roots+=("$(brew --cache)")
            local root file
            for root in "${roots[@]}"; do
              [[ -d "$root" ]] || continue
              echo "----- tree ${root} -----" >&2
              find "$root" \( -iname '*alighieri*' -o -iname '*sandbox*' -o -iname '*.log' \) >&2 || true
            done
            while IFS= read -r file; do
              [[ -f "$file" ]] || continue
              echo "===== log ${file} =====" >&2
              # Keep the Actions log readable if a bottle pour log is huge.
              tail -n 400 "$file" >&2 || true
            done < <(find "${HOME}/Library/Logs/Homebrew" "$(brew --prefix)/var/log" \
              -type f \( -iname '*alighieri*' -o -iname '*sandbox*' \) 2>/dev/null || true)
          }
          # --debug keeps the sandbox failure's child output. Logs below are
          # local to the runner; nothing is uploaded.
          if ! brew install --verbose --debug --keep-tmp --formula local/alighieri/alighieri >"$log" 2>&1; then
            dump_homebrew_failure
            exit 1
          fi
          if ! grep -F "Checking out revision ${expected_rev}" "$log" >/dev/null \
            && ! grep -F "checkout -f ${expected_rev}" "$log" >/dev/null; then
            echo "install did not check out the formula-selected revision ${expected_rev}" >&2
            cat "$log" >&2
            exit 1
          fi
          if grep -F "v0.6.0.tar.gz" "$log" >/dev/null; then
            echo "local install fetched the v0.6.0 archive" >&2
            cat "$log" >&2
            exit 1
          fi
          # Dependency set of the commit Homebrew selected, not merely the
          # worktree file that happens to be checked out.
          git show "${expected_rev}:Cargo.lock" >"${RUNNER_TEMP}/selected-Cargo.lock"
          python3 - "${RUNNER_TEMP}/selected-Cargo.lock" <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          versions = []
          for block in text.split("[[package]]"):
              if re.search(r'^name = "rustls"$', block, re.M):
                  match = re.search(r'^version = "([^"]+)"', block, re.M)
                  versions.append(match.group(1) if match else "")
          if not versions:
              sys.exit("formula-selected Cargo.lock has no rustls package")

          def parse(version):
              core = version.split("-", 1)[0].split("+", 1)[0]
              parts = []
              for part in core.split("."):
                  if not part.isdigit():
                      sys.exit(f"unparseable rustls version {version}")
                  parts.append(int(part))
              while len(parts) < 3:
                  parts.append(0)
              return tuple(parts[:3])

          floor = (0, 23, 45)  # RUSTSEC-2026-0285 fixed rustls 0.23.40
          for version in versions:
              if parse(version) < floor:
                  sys.exit(
                      f"formula-selected rustls {version} is older than "
                      "0.23.45 (RUSTSEC-2026-0285)"
                  )
          print("formula-selected rustls " + ", ".join(versions))
          PY
      - name: Test formula
        run: |
          brew test alighieri
          alighieri --version
          alighieri --check --config "$(brew --prefix)/etc/alighieri.conf"

  # Lint the Linux management scripts and run their bundled self-tests (the
  # installer's path-normalisation and hardened-path warning logic). shellcheck
  # is preinstalled on the GitHub-hosted Ubuntu runners.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Linux helpers are executable
        run: |
          test -x scripts/alighieri.sh
          test -x scripts/install-linux.sh
          test -x scripts/package-unix.sh
          test -x scripts/macos-install-smoke.sh
          test -x scripts/macos-daemon.sh
          test "$(git ls-files -s scripts/macos-daemon.sh | awk '{print $1}')" = 100755
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - name: Run installer self-tests
        run: |
          bash scripts/alighieri.sh __selftest
          bash scripts/macos-daemon.sh __selftest
          bash scripts/macos-install-smoke.sh
          if ASSET="$(scripts/package-unix.sh --os macos --target t --version v --bindir /no-such-bindir --archive 2>/dev/null)"; then
            echo "package-unix.sh must fail when the bindir is missing" >&2
            exit 1
          fi
          test -z "${ASSET:-}"

  # Verify the crate still builds on its declared minimum supported Rust
  # version (Cargo.toml `rust-version`). Clippy and rustfmt stay on the stable
  # job above: their output drifts across releases, so pinning them here would
  # freeze tooling at the MSRV instead of tracking current stable.
  msrv:
    name: build on MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@98e1b82157cd469e843cb7f524c1313b4ad9492c # 1.88.0
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build all targets on the MSRV toolchain
        run: cargo build --all-targets --locked
      # Verify every non-default target, including the Linux installer
      # companion, also builds on the MSRV toolchain.
      - name: Build with all features on the MSRV toolchain
        run: cargo build --all-targets --locked --all-features

  # Exercise the exact source archive that crates.io will receive. This catches
  # allowlist mistakes, missing docs/examples, and dependencies on repository
  # files that are not present after Cargo extracts the `.crate` archive.
  package:
    name: crates.io package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build all-feature documentation (warnings denied)
        run: cargo doc --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check package contents
        shell: bash
        run: |
          set -euo pipefail
          package_list="$RUNNER_TEMP/alighieri-package-files.txt"
          cargo package --list --locked > "$package_list"

          required=(
            Cargo.toml
            Cargo.lock
            src/lib.rs
            src/main.rs
            src/bin/alighieri-installer-fs.rs
            src/bin/alighieri-rdp-agent.rs
            src/bin/alighieri-rdp-transport.rs
            src/rdp/protocol.rs
            src/platform/linux.rs
            README.md
            CHANGELOG.md
            LICENSE
            LICENSING.md
            doc/alighieri.conf
            doc/management-cli.md
            doc/plugin-sdk.md
            doc/rdp-transport.md
            scripts/alighieri.sh
            scripts/install-linux.sh
            scripts/macos-daemon.sh
            doc/macos-launchagent.plist
            doc/macos-launchdaemon.plist
          )
          for path in "${required[@]}"; do
            if ! grep -Fqx "$path" "$package_list"; then
              echo "::error::Required package file is missing: $path"
              exit 1
            fi
          done

          forbidden='^(\.github|\.agents|\.codex|target)/|^(\.dockerignore|Dockerfile)$'
          if grep -En "$forbidden" "$package_list"; then
            echo "::error::The package contains repository-only files"
            exit 1
          fi
      - name: Build and extract package
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked
          package_version="$(
            python3 -c \
              'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])'
          )"
          crate_file="target/package/alighieri-$package_version.crate"
          if [[ ! -f "$crate_file" ]]; then
            echo "::error::cargo package did not produce $crate_file"
            exit 1
          fi

          extract_root="$RUNNER_TEMP/alighieri-package"
          mkdir -p "$extract_root"
          tar -xzf "$crate_file" -C "$extract_root"
          crate_dir="$(find "$extract_root" -mindepth 1 -maxdepth 1 -type d -name 'alighieri-*' -print -quit)"
          if [[ -z "$crate_dir" ]]; then
            echo "::error::Could not locate the extracted alighieri package"
            exit 1
          fi
          echo "CRATE_DIR=$crate_dir" >> "$GITHUB_ENV"
      - name: Test extracted package (default features)
        run: cargo test --manifest-path "$CRATE_DIR/Cargo.toml" --all-targets --locked
      - name: Test extracted package (all features)
        run: cargo test --manifest-path "$CRATE_DIR/Cargo.toml" --all-targets --all-features --locked
      - name: Install and smoke-test extracted binary
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/alighieri-install"
          cargo install --path "$CRATE_DIR" --locked --root "$install_root"
          "$install_root/bin/alighieri" --version
          "$install_root/bin/alighieri" --help
          "$install_root/bin/alighieri" --check "$CRATE_DIR/doc/alighieri.conf"
          test ! -e "$install_root/bin/alighieri-installer-fs"

  # There is no registry baseline until the manual 0.4.0 publication. Probe for
  # that exact version so this job is harmless before the first release and
  # automatically becomes a required compatibility check afterwards.
  semver:
    name: public API semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check whether the 0.4.0 registry baseline exists
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/alighieri-0.4.0.json"
          status="$(
            curl --silent --show-error --location \
              --retry 3 --retry-all-errors \
              --header "User-Agent: Wiresock-Foundation/alighieri CI" \
              --output "$response" --write-out '%{http_code}' \
              https://crates.io/api/v1/crates/alighieri/0.4.0
          )"
          case "$status" in
            200)
              echo "available=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "alighieri 0.4.0 is not published yet; skipping the semver baseline check"
              ;;
            *)
              cat "$response"
              echo "::error::crates.io returned HTTP $status while checking the semver baseline"
              exit 1
              ;;
          esac
      - name: Check public API compatibility
        if: steps.baseline.outputs.available == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: alighieri
          feature-group: all-features
