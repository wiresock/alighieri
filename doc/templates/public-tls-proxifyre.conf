# Alighieri public SOCKS5-over-TLS starter configuration for ProxiFyre
#
# Before starting the service:
# 1. Replace every example domain, email, and path below as needed. Create a DNS
#    A record pointing the domain at this VPS before Let's Encrypt issuance.
#    This profile listens on IPv4; publish AAAA only when IPv6 TCP 443 is
#    forwarded to this listener, otherwise ACME validation can follow IPv6 to
#    the wrong endpoint and fail.
# 2. Allow inbound TCP 443 in the host firewall and cloud security group, allow
#    outbound TCP 443 for ACME, and make sure no other service occupies TCP 443.
#    TLS-ALPN-01 does not require opening HTTP port 80.
# 3. Create the userlist before starting Alighieri (the command prompts for the
#    password securely and stores an Argon2id hash):
#      sudo alighieri user add proxyuser --userlist /etc/alighieri/users
#      sudo chown root:alighieri /etc/alighieri/users
#      sudo chmod 640 /etc/alighieri/users
# 4. UDP ASSOCIATE is enabled below. Allow inbound UDP 40000-40099 as well, or
#    disable UDP by removing both udp.* settings and removing `udp` and
#    `udpassociate` from the public-internet rule.
#
# TLS protects the SOCKS5 control connection and username/password exchange.
# Relay UDP datagrams use separate UDP sockets and are not encapsulated in that
# TLS connection. Applications such as QUIC, voice clients, and games may apply
# their own payload encryption.

internal: 0.0.0.0 port = 443
external: 0.0.0.0

socksmethod: username
userlist: /etc/alighieri/users
auth.cachettl: 300

# The contact address is optional. Uncomment it after replacing the example.
# tls.acme.email: admin@example.com
tls.acme.domains: proxy.example.com
tls.acme.cache: /var/lib/alighieri/acme
# Production is the secure default. Staging is useful for testing, but its
# certificates are not trusted by normal clients.
# tls.acme.staging: on

udp.portrange: 40000-40099
udp.advertise: proxy.example.com

ratelimit.authfailurerate: 5/300

connecttimeout: 30
handshaketimeout: 10
iotimeout: 0
udptimeout: 60
maxconnections: 1024

logoutput: stdout
logformat: text

dns.prefer: system
dns.tryall: false
# Keep this policy in place: it blocks literal and resolved private, link-local,
# loopback, and reserved destinations before ACL evaluation.
dns.deny: private linklocal loopback reserved
dns.cachettl: 60

client pass "public-authenticated-clients" {
    from: 0.0.0.0/0 to: 0.0.0.0/0
}

# Keep explicit loopback denial ahead of the public allow rule. dns.deny above
# also covers loopback and the other unsafe destination categories.
socks block "deny-loopback" {
    from: 0.0.0.0/0 to: 127.0.0.0/8
}

socks pass "public-internet" {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    protocol: tcp udp
    command: connect udpassociate
    method: username
}
